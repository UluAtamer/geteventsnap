name: geteventsnap-local
services:
  mysql:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: eventsnap
      MARIADB_USER: eventsnap
      MARIADB_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Run npm run local:setup first}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - "127.0.0.1:33069:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
