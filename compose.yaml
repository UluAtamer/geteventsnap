# Dokploy Compose: use an existing PostgreSQL service on dokploy-network.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the Dokploy PostgreSQL internal connection URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SITE_URL: ${SITE_URL:?Set the public HTTPS origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth client secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SEED_USER_ENABLED: ${SEED_USER_ENABLED:-false}
      SEED_USER_IS_ADMIN: ${SEED_USER_IS_ADMIN:-false}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      GUEST_MAX_PHOTO_BYTES: ${GUEST_MAX_PHOTO_BYTES:-26214400}
      GUEST_MAX_VIDEO_BYTES: ${GUEST_MAX_VIDEO_BYTES:-524288000}
    expose:
      - "3000"
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
